version: "3.8"

services:
  # ---------------- API GATEWAY ----------------
  api-gateway:
    build:
      context: ./
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      preprocessing:
        condition: service_started
      clustering:
        condition: service_started
      prediction:
        condition: service_started
    volumes:
      - ./models:/models
      - ./data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------- PREPROCESSING SERVICE ----------------
  preprocessing:
    build:
      context: ./
      dockerfile: preprocessing-service/Dockerfile
    ports:
      - "8002:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env

  # ---------------- CLUSTERING SERVICE ----------------
  clustering:
    build:
      context: ./
      dockerfile: clustering-service/Dockerfile
    ports:
      - "8003:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env

  # ---------------- PREDICTION SERVICE ----------------
  prediction:
    build:
      context: ./
      dockerfile: prediction-service/Dockerfile
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./models:/models
    env_file: .env

  # ---------------- DASHBOARD (STREAMLIT) ----------------
  dashboard:
    image: python:3.10-slim
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
      - ./data:/data
    working_dir: /app
    environment:
      - API_BASE=http://api-gateway:8000
    command: sh -c "pip install --no-cache-dir -r requirements.txt && streamlit run app.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      api-gateway:
        condition: service_healthy

  # ---------------- RQ WORKER ----------------
  worker:
    build:
      context: ./
      dockerfile: worker/Dockerfile
    stop_grace_period: 65m
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./models:/models
      - ./data:/data

  # ---------------- OPTIONAL API (ASYNC CLIENT) ----------------
  api:
    build:
      context: ./
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      worker:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env

  # ---------------- POSTGRES ----------------
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: accidents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ---------------- REDIS ----------------
  redis:
    image: redis:6
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------- MINIO ----------------
  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data

# ---------------- VOLUMES ----------------
volumes:
  pgdata:
  minio_data:




